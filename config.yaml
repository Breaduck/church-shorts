# 교회 설교 영상 → 자동 쇼츠 생성기 설정

church:
  name: "우리교회"  # 자막/제목에 참고용으로 쓰일 수 있음

whisper:
  # PC에 NVIDIA GPU 없음(CPU 전용 확인됨).
  # 이 모델은 두 곳에 쓰인다: (1) 유튜브 자동 자막이 없는 영상의 전체 전사 폴백,
  # (2) 하이라이트로 뽑힌 클립만 최종 자막용으로 정밀 재전사(main.py 5단계).
  # large-v3가 기독교 용어 정확도는 더 좋지만 이 네트워크에서 최초 다운로드가
  # HF_TOKEN 없이는 심하게 느려서(레이트리밋+Windows 심링크 미지원) medium으로 유지.
  model_size: "medium"
  # 최종 화면 자막용 "정밀 재전사"에만 쓰는 모델. 유튜브 자동자막이 부정확해서 선택된
  # 짧은 클립만 이 모델로 다시 전사한다. medium은 교회 용어를 자주 틀린다. large-v3로
  # 올리면 정확도가 확 좋아진다(짧은 클립만 돌려서 시간 부담도 작음). 단 최초 1회 모델
  # 다운로드(~3GB)가 필요하다 — 다운로드가 끝나면 그 뒤로는 캐시되어 빠르다.
  precise_model_size: "large-v3"
  device: "cpu"
  compute_type: "int8"      # cpu는 int8 권장, cuda는 float16 권장
  # 렌더 속도의 최대 병목은 large-v3 CPU 정밀 재전사였다(클립당 3~6분 실측). 두 가지로 줄인다:
  #  - cpu_threads: 0(기본)이면 ctranslate2가 4스레드만 써서 8코어의 절반이 논다. 물리 코어 수로.
  #  - batch_size: 정밀 재전사를 BatchedInferencePipeline로 돌릴 때 VAD 발화 조각을 이만큼
  #    병렬 디코딩(CPU에서도 2~4배 빠름, 정확도 동일 계열).
  cpu_threads: 8
  batch_size: 8
  language: "ko"
  word_timestamps: true     # 단어 단위 타임스탬프 필수 (자막 정싱크 + 카라오케 강조의 기반)
  vad_filter: true          # 무음/잡음 구간 오인식 억제 -> 자막 정확도 향상
  # 설교 도메인 어휘 힌트. Whisper 디코딩을 이 단어들 쪽으로 편향시켜 교회 용어 오탈자를 줄인다.
  # (전체 영상이 아니라 정밀 재전사에 사용됨. 교단/설교자 자주 쓰는 표현을 추가하면 더 좋아짐.)
  initial_prompt: "이것은 기독교 교회 설교입니다. 하나님, 예수님, 그리스도, 성령, 은혜, 구원, 복음, 믿음, 기도, 말씀, 성경, 십자가, 부활, 사랑, 소망, 영광, 할렐루야, 아멘 같은 표현이 자주 나옵니다."
  # 성경 고유명사 사전(hotwords 후보 풀). 주의: faster-whisper는 hotwords를 앞 223토큰까지만
  # 쓰고 뒤는 조용히 버린다(실측: 이 사전 전체는 500토큰+라 뒷부분의 성경책 이름과, 뒤에 이어
  # 붙이던 클립별 keywords가 통째로 무효였음 — 출애굽기→'출애국기' 오인식의 근본 원인).
  # 그래서 이 사전은 '통째로' 넣지 않는다: main.py가 클립별로 (1) Claude가 뽑은 keywords를 맨 앞에,
  # (2) 이 사전 중 해당 설교 전사본에 실제로 등장하는 단어만 골라 예산 안에서 hotwords를 만든다.
  bible_hotwords: >-
    여호와 예수 그리스도 임마누엘 메시아 엘로힘 엘샤다이 여호와이레 여호와닛시 여호와샬롬 알파와오메가
    아담 하와 가인 아벨 셋 에녹 므두셀라 라멕 노아 셈 함 야벳 니므롯 데라 아브라함 아브람 사라 사래 하갈
    이스마엘 롯 멜기세덱 아비멜렉 이삭 리브가 브두엘 라반 야곱 에서 이스라엘 라헬 레아 빌하 실바
    르우벤 시므온 레위 유다 단 납달리 갓 아셀 잇사갈 스불론 요셉 베냐민 디나 다말 보디발 바로
    모세 아론 미리암 십보라 이드로 여호수아 갈렙 훌 브살렐 발람 발락 고라 나답 아비후 엘르아살 비느하스
    라합 옷니엘 에훗 삼갈 드보라 바락 야엘 시스라 기드온 여룹바알 아비멜렉 돌라 야일 입다 입산 엘론 압돈
    삼손 들릴라 마노아 룻 나오미 보아스 오벳 이새 엘리멜렉 오르바 엘리 한나 브닌나 엘가나 홉니 비느하스
    사무엘 사울 기스 요나단 다윗 골리앗 아비가일 나발 미갈 밧세바 우리아 나단 갓 압살롬 암논 아도니야
    솔로몬 르호보암 여로보암 아히야 시므이 요압 아비새 아사헬 아브넬 이스보셋 므비보셋 사독 아비아달
    엘리야 엘리사 게하시 나아만 아합 이세벨 오바댜 예후 아하시야 요람 아달랴 요아스 아마샤 웃시야 요담
    아하스 히스기야 므낫세 아몬 요시야 여호아하스 여호야김 여호야긴 시드기야 오므리 바아사 나답 시므리
    이사야 예레미야 바룩 에스겔 다니엘 사드락 메삭 아벳느고 벨사살 다리오 고레스 느부갓네살 아하수에로
    호세아 고멜 요엘 아모스 요나 미가 나훔 하박국 스바냐 학개 스가랴 말라기 오바댜
    에스라 느헤미야 산발랏 도비야 에스더 모르드개 하만 와스디 욥 엘리바스 빌닷 소발 엘리후 스룹바벨 여호수아
    마리아 요셉 엘리사벳 사가랴 세례요한 시므온 안나 베드로 시몬베드로 안드레 야고보 요한 빌립 바돌로매
    도마 마태 레위 나다나엘 시몬 가룟유다 맛디아 바울 바나바 실라 디모데 디도 누가 마가 마가요한 스데반
    아볼로 브리스길라 아굴라 빌레몬 오네시모 나사로 마르다 막달라마리아 삭개오 니고데모 아리마대요셉
    빌라도 헤롯 헤로디아 가야바 안나스 고넬료 아나니아 삽비라 도르가 다비다 루디아 데마 두기고 오네시보로
    에바브라 에바브로디도 유두고 유니게 로이스 뵈뵈 가이오 데메드리오 알렉산더 후메내오 부겐도 벨릭스
    베스도 아그립바 버니게 드루실라 글라우디오 가이사 아구스도 디베료 구레뇨 루스도 서기오바울 엘루마
    에덴 애굽 이집트 가나안 베들레헴 예루살렘 나사렛 갈릴리 가버나움 벳새다 고라신 여리고 벧엘 헤브론
    실로 브엘세바 소돔 고모라 소알 모리아 브니엘 세겜 벧레헴 시내산 호렙산 느보산 갈멜산 길보아산 모레
    시온 감람산 겟세마네 골고다 갈보리 요단강 요르단 사해 홍해 갈릴리호수 게네사렛 사마리아 수가 다메섹
    안디옥 다소 빌립보 고린도 에베소 데살로니가 골로새 라오디게아 서머나 버가모 두아디라 사데 빌라델비아
    로마 바벨론 앗수르 니느웨 모압 미디안 블레셋 아말렉 에돔 암몬 두로 시돈 구스 스바 다시스 밧모
    가이사랴 욥바 룻다 살라미 바보 버가 이고니온 루스드라 더베 밀레도 드로아 아덴 고레네 구브로 그레데
    아라랏 우르 하란 브엘라해로이 마므레 막벨라 브에스다 실로암 베다니 엠마오 아리마대 라마 기브아 미스바
    창세기 출애굽기 레위기 민수기 신명기 여호수아 사사기 룻기 사무엘상 사무엘하 열왕기상 열왕기하
    역대상 역대하 에스라 느헤미야 에스더 욥기 시편 잠언 전도서 아가 이사야 예레미야 예레미야애가 에스겔 다니엘
    호세아 요엘 아모스 오바댜 요나 미가 나훔 하박국 스바냐 학개 스가랴 말라기
    마태복음 마가복음 누가복음 요한복음 사도행전 로마서 고린도전서 고린도후서 갈라디아서 에베소서 빌립보서
    골로새서 데살로니가전서 데살로니가후서 디모데전서 디모데후서 디도서 빌레몬서 히브리서 야고보서
    베드로전서 베드로후서 요한일서 요한이서 요한삼서 유다서 요한계시록
    일장 이장 삼장 사장 오장 육장 칠장 팔장 구장 십장 장 절 상 하 편 본문 말씀 개역개정
    고엘 맥추감사절 유월절 오순절 초막절 부림절 나팔절 속죄일 희년 안식일 안식년 언약궤 법궤 성막 성소
    지성소 십일조 할례 세례 침례 회개 중보 대속 속죄 번제 소제 화목제 속건제 만나 메추라기 소제물
    바리새인 사두개인 서기관 산헤드린 레위인 제사장 대제사장 회당 성전 광야 출애굽 포로귀환 승천 재림
    부활절 성탄절 대강절 사순절 종려주일 고난주간 성령강림절 삼위일체 사도신경 주기도문 아멘 할렐루야 호산나

highlights:
  mode: "auto"              # "auto" = claude -p 서브프로세스 자동 호출 / "manual" = 이 세션에서 수동 선정
  # 하이라이트 선정에 쓸 모델. 이 단계는 전사본을 읽고 판단하는 작업이라 Sonnet으로 충분하고,
  # Opus 대비 토큰 비용이 몇 배 저렴하다. 빈 값("")이면 claude CLI 기본 모델을 따른다(예전 동작).
  # 주의: 별칭 "sonnet"은 CLI가 최신 세대(Sonnet 5)로 연결하는데, Sonnet 5는 장문 분석에서
  # 기본으로 수 분씩 '생각(thinking)'해 선정이 4~7분까지 늘어진다(실측: ttft 261초/총 279초,
  # 미니 프롬프트는 5초 → 계정·API 문제 아님). 예전처럼 빠르던 4.5 세대로 명시 고정한다(실측 정상).
  model: "claude-sonnet-4-5"
  # 선정 시 '생각(thinking)' 토큰 상한. 속도↔품질 트레이드오프: 1024로 조였더니 빨라진 대신
  # "재미없는 구간만 뽑는다"는 품질 문제가 생겨(2026-09-01), 전사본에서 장면(예화 클라이맥스·
  # 웃음·고백)을 제대로 사냥할 여유를 주는 4096으로 올림. 선정이 1~2분 더 걸릴 수 있다.
  thinking_tokens: 4096
  min_clips: 3
  max_clips: 6  # 후보 폭을 넓혀 사람이 고를 여지를 준다(양보다 질 원칙은 프롬프트가 유지)
  min_duration_sec: 20
  max_duration_sec: 60
  # 렌더 단계의 절대 상한. 2026 플랫폼 데이터 조사 결과: 쇼츠/릴스 모두 "길이보다 완결 시청률"이
  # 핵심이고, 유튜브 쇼츠는 30~60초(50~60초대가 10초 미만 대비 조회수 최대), 릴스는 45~60초가
  # 스위트스팟이며 스토리텔링/교육형(설교가 여기 해당)은 60~90초도 잘 통한다.
  # → 선정은 60초를 목표로 하되, 문장/맥락이 그 안에서 안 끝나면 80초까지는 끊지 않고 완결시킨다
  # (말이 중간에 뚝 끊긴 클립은 완결 시청률이 무너져 어떤 길이보다 나쁘다).
  hard_max_duration_sec: 80
  # 하이라이트 선정은 전적으로 Claude가 전사본을 읽고 설교의 맥락/의미를 이해해서 판단한다.
  # 아래 카테고리는 "이런 걸 찾아봐"라는 참고 관점일 뿐, 기계적 키워드 매칭이 아니다.
  # audio_peaks(오디오 에너지)는 보조 힌트로만 프롬프트에 곁들이고, 최종 판단 기준으로 쓰지 않는다.
  categories:
    - "설교 핵심 메시지/명언 구절 (짧게 잘라도 그 자체로 완결되고 울림이 있는 부분)"
    - "설교 흐름상 감정이 고조되거나 반전이 있는 부분 (오디오 힌트는 참고만, 실제 판단은 내용 이해로)"
    - "맥락상 일반 시청자도 공감하거나 '이건 뜨겠다' 싶은 부분"
  # 바이럴 쇼츠 구조 강제: Hook(첫 1~3초 임팩트 문장) -> Build(맥락) -> Payoff(반전/울림/명언으로 마무리)
  # highlights.py의 프롬프트가 이 구조를 명시적으로 요구해야 함 (자세한 건 highlights.py 참고)
  require_hook_first_sentence: true   # 클립의 시작이 완결된 한 문장(훅)으로 시작하도록 경계를 스냅
  require_payoff_last_sentence: true  # 클립의 끝이 어중간하게 끊기지 않고 문장이 완결되도록 스냅

audio_peaks:
  # 기본 끔: 이건 "참고용 힌트"일 뿐인데(실판단은 Claude가 전사본 읽고 함) librosa가 30~60분
  # 오디오를 통째로 디코딩하느라 링크 넣은 직후 수십 초를 잡아먹는다. 속도 우선이라 비활성화.
  enabled: false            # 보조 힌트 전용. highlights.py 프롬프트에 "참고 신호"로만 첨부됨
  frame_length_sec: 1.0
  hop_length_sec: 0.5

render:
  aspect_ratio: "9:16"
  resolution: [1080, 1920]
  # 비디오 인코더: 이 PC의 Intel Arc iGPU 하드웨어 인코딩(h264_qsv)이 기본. 실패 시
  # render.py가 자동으로 libx264로 폴백한다. 강제 소프트웨어 인코딩은 "libx264"로.
  video_encoder: "h264_qsv"
  # "card" (흰 배경 + 둥근 모서리 영상 박스 + 상단 고정 제목 + 하단 캡션, 참고 이미지 스타일)
  # | "pad" (흰 여백만) | "blur" (배경 블러 채움) | "crop" (중앙 크롭)
  background_mode: "card"
  pad_color: "white"        # background_mode: pad일 때 여백 색상
  card_layout:
    # 좌우로 미세한 여백을 줘서 영상이 화면 끝에 딱 붙지 않고 "숨 쉬게" 한다.
    # 1080이면 좌우 여백 0(끝에 딱 붙음). 1032면 (1080-1032)/2 = 24px씩 좌우 여백.
    video_box_width: 1032     # 영상 박스 너비 (좌우 24px씩 여백)
    # 영상 박스를 채우는 방식. 사용자 결정: "fit" — 유튜브 원본 16:9를 하나도 안 자르고
    # 그대로 넣는다(교회 자막/로고 포함). 세로 화면을 다 못 채우는 만큼 위아래는 흰 여백으로 둔다.
    #  - "fit": 원본 비율 그대로(안 자름). 위아래 흰 여백 생김.
    #  - "cover": 박스를 video_box_aspect로 크게 잡고 좌우/하단을 잘라 꽉 채움(현재 미사용).
    fill_mode: "fit"
    video_box_aspect: [4, 3]  # cover 모드에서만 사용
    # video_box_height는 여기서 고정하지 않는다. fill_mode에 따라 render.py가 계산한다.
    # video_box_y도 고정하지 않는다: title_area_height와 caption_area_height를 제외한
    # 나머지 중간 공간에 영상 박스가 수직 중앙 정렬되도록 render.py가 계산한다.
    title_area_height: 360    # 제목 영역 높이 (상단) - 글씨가 커져서 영역도 확장
    caption_area_height: 380  # 캡션 영역 높이 (하단)
    corner_radius: 36         # 둥근 모서리 반경(px)
    # 사용자 결정: 원본 하단을 자르지 않는다(교회 자막 '1. …' 등도 그대로 보여줌).
    source_crop_bottom_pct: 0.0
  # 무음 자동 제거는 끈다. 켜면 (1) 카드에 뜨는 "N초" 라벨(clip.end-clip.start, 원본 기준)이
  # 실제로 짧아진 mp4 길이와 안 맞고, (2) 압축된 타임라인에 자막을 remap하는 과정에서
  # ffmpeg select의 프레임 단위 컷과 연속 수식 remap 사이 오차가 컷마다 누적돼 목소리-자막
  # 싱크가 뒤로 갈수록 밀린다. 신뢰성(정확히 그 구간을 그대로) 우선이라 비활성화.
  # (remove_silence 관련 코드/리매핑은 그대로 두어 나중에 프레임정밀 방식으로 재시도 가능.)
  remove_silence: false
  # 클립 끝에 마지막 프레임을 정지시킨 채 무음을 이만큼(초) 덧붙인다. 문장이 끝나자마자
  # 마이크가 뚝 끊기는 느낌을 없애고 "여운/숨"을 준다. 0이면 끔. (자막은 이미 끝나 있어 정지
  # 구간엔 아무 글자도 안 뜬다. 카드 'N초' 라벨은 이 여운을 뺀 본문 길이 기준이라 실제 mp4는
  # 약 이만큼 더 길다.)
  end_pad_sec: 1.0
  silence_threshold_db: -35
  silence_min_duration_sec: 1.2  # 설교자의 정상적인 강조 호흡(0.6~1초대)까지 잘라내면 말이 너무 툭툭 끊겨서 상향
  ken_burns:
    # 기본 꺼둠: zoompan 필터의 자기참조 'zoom' 변수가 d=1(연속 영상)일 때
    # 프레임마다 리셋되어 실제로는 전혀 줌인되지 않는 현상을 실측으로 확인함
    # (정지 이미지로 격리 테스트: 40초 후에도 프레임이 시작과 완전히 동일).
    # 부가 기능(화려한 기교 없어도 된다는 요구사항)이라 더 파고들지 않고 비활성화.
    # 나중에 다른 방식(예: 프레임별 오프셋을 미리 계산해 scale+crop에 전달)으로 재시도 가능.
    enabled: false
    zoom_per_sec: 0.008       # 아주 미세하게 (과하면 산만함)
  hook:
    enabled: true            # card 레이아웃에서는 제목이 클립 처음부터 끝까지 상단에 고정 표시됨
    always_on: true           # true면 duration_sec 무시하고 클립 전체 길이 동안 표시
    duration_sec: 3           # always_on: false일 때만 사용 (레거시 pad/blur/crop 모드용)
    font_size_multiplier: 1.3

captions:
  enabled: true
  template: "karaoke"        # "minimal" | "vibrant" | "karaoke" — 단어별 강조가 정확도 체감/몰입도를 높임
  font_path: "assets/fonts/Pretendard-Bold.ttf"
  font_family: "Pretendard"  # ASS Fontname은 파일명이 아니라 폰트 내부 family name과 일치해야 함
  font_size: 72
  title_font_size: 190  # 자막(72)의 2배 이상. 더 크고 눈에 띄게(사용자 요청, 2026-08-23)
  title_font_family: "Pretendard ExtraBold"  # 자막(Pretendard Bold)보다 더 굵게
  # 흰 배경(card/pad) 기준 색상: 검정 텍스트 + 강조 단어만 빨강, 흰 얇은 외곽선으로 살짝 대비만.
  primary_color: "&H00000000"     # 검정
  outline_color: "&H00FFFFFF"     # 흰색 (얇은 외곽선)
  outline_width: 2
  max_words_per_line: 4         # 한 화면에 3~4단어만 -> 짧고 정갈하게, 가독성 최우선
  # 자막에서 뜻 없는 추임새를 걷어낸다(자막은 전사 기록이 아니라 읽기 보조물).
  strip_filler: true            # 순수 간투사(음·어·에·으·엄·아) 제거 — 부작용 거의 없음
  # 설교 구어에 흔한 "그"·"막"·"뭐" 등도 제거(훨씬 깔끔). 단 가끔 "그 사람"→"사람"처럼
  # 지시어가 빠질 수 있다(남는 명사가 뜻을 가져 대개 자연스러움). 설교 채널 권장.
  aggressive_filler: true
  position: "bottom"            # "bottom" | "center" (card 레이아웃에서는 무시되고 영상 박스 아래 캡션 영역에 고정)
  karaoke_highlight_color: "&H0080DE4A"  # 강조 단어 색 (연두/초록)
  # 플랫폼 UI 안전 영역: pad/blur/crop 레거시 모드에서만 사용 (card 레이아웃은 영상 밖에 캡션이 있어 해당 없음)
  safe_area_bottom_pct: 0.20
  safe_area_top_pct: 0.10
  # 전사 오인식 확정 교정 사전(부분 문자열 치환). hotwords 편향으로도 새는, 반복 실측된
  # 오탈자만 넣는다 — 성경 용어처럼 "절대 틀리면 안 되는" 단어의 최종 안전망.
  # 주의: 다른 멀쩡한 단어의 일부와 겹치지 않는, 충분히 긴 오인식 문자열만 넣을 것.
  corrections:
    "출애국기": "출애굽기"
    "출애굽이": "출애굽기"
    "요호와": "여호와"
    "요호아": "여호와"
    "여호아": "여호와"

upload:
  youtube:
    enabled: true
    default_privacy: "unlisted"   # 테스트 단계는 unlisted 권장
    category_id: "22"             # People & Blogs (설교/종교는 별도 카테고리 없음)
    # 업로드 후 성과 자동 추적: 주 1회, 최대 track_max_checks회(기본 4회=한달) 조회수/좋아요/댓글을
    # YouTube Data API로 가져와 feedback.json에 자동 반영한다(사람이 입력한 rating/메모는 보존).
    track_interval_days: 7
    track_max_checks: 4
  instagram:
    enabled: false   # Phase C: Meta 앱 심사 후 활성화
  tiktok:
    enabled: false    # Phase C: audit 승인 후 활성화
