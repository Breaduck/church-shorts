<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>교회 쇼츠 편집기</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --text: #191f28; --muted: #6b7684;
    --faint: #8b95a1; --accent: #3182f6; --accent-hover: #1b64da; --border: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151617; --card:#1f2123; --text:#ececea; --muted:#9a9aa2;
            --faint:#77777e; --accent:#5aa2ff; --accent-hover:#7ab4ff; --border:#2e3033; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card); border-radius: 24px; max-width: 420px; width: calc(100% - 40px);
    padding: 40px 32px; text-align: center;
    box-shadow: 0 2px 8px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.03);
  }
  .logo { font-size: 40px; margin-bottom: 14px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .btn {
    display: block; width: 100%; background: var(--accent); color: #fff;
    border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .state { font-size: 12.5px; color: var(--faint); margin: 16px 0 0; }
  .state .ok { color: #12b886; font-weight: 600; }
  code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 7px; font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>교회 쇼츠 편집기</h1>
    <p>편집기는 이 PC 안에서 실행돼요.<br>아래 버튼을 누르면 편집기가 열립니다.</p>
    <a class="btn" href="http://localhost:5000/">편집기 열기</a>
    <p class="state" id="state">꺼져 있다면 프로젝트 폴더의 <code>편집기.bat</code> 을 더블클릭해 켜주세요.</p>
  </div>

<script>
  // 편집기가 켜져 있으면 자동으로 넘어간다. 단, 최신 크롬은 https 페이지에서 localhost
  // 감지(fetch)를 보안 정책(Local Network Access)으로 막을 수 있어 감지 실패가 "꺼짐"을
  // 뜻하지 않는다 — 그래서 버튼은 항상 즉시 보여주고, 감지는 되면 좋은 보너스로만 쓴다.
  // (버튼의 직접 이동(top-level navigation)은 정책과 무관하게 항상 동작한다.)
  var stateEl = document.getElementById("state");
  function probe() {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 1500);
      fetch("http://localhost:5000/", { mode: "no-cors", cache: "no-store" })
        .then(function () { if (!done) { done = true; clearTimeout(t); resolve(true); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
    });
  }
  (async function () {
    if (await probe()) {
      stateEl.innerHTML = '<span class="ok">편집기 켜짐</span> — 자동으로 이동합니다…';
      setTimeout(function () { window.location.replace("http://localhost:5000/"); }, 400);
    }
  })();
</script>
</body>
</html>
